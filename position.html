<!doctype html>

<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Elladee's index page</title>
    <style>
div{
    width:300px;
    height:300px;
    background:brown;
    margin:50px;
}
#static{
    background: pink;
    position: static; /* default position*/
}
#sticky{
    background:orangered;
    position: sticky; /*static until hits edge*/
}
#relative{
    background:seagreen;
    position: relative; /*moves box but leaves hole*/
    left:150px;
    top:-150px;
    z-index:-10;
}
#fixed{
    background:purple;
    position:fixed;/*stuck to screen, leaves no hole*/
    top:50px;
    right:50px;
}
#absolute{
    background:burlywood;
    position:absolute;
    right:50px;
    bottom:50px;
}bvvgg

    </style>
</head>

<body>
    <div id="static"></div>
    <div id="sticky"></div>
    <div id="relative"></div>
    <div id="fixed"></div>
    <div id="absolute"></div>
</body>

</html>
